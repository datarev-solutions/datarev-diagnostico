<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Simulator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  /* Language toggle */
  .lang-toggle { position: fixed; top: 14px; right: 14px; display: flex; background: #1e293b; border: 1px solid #334155; border-radius: 20px; overflow: hidden; z-index: 100; }
  .lang-toggle button { background: transparent; border: none; color: #94a3b8; padding: 6px 14px; cursor: pointer; font-weight: 700; font-size: 12px; transition: all 0.2s; }
  .lang-toggle button.active { background: linear-gradient(135deg, #1763ff, #7a1020); color: #fff; }

  /* Header */
  .header { text-align: center; padding: 56px 20px 8px; }
  .header h1 { font-size: 26px; background: linear-gradient(135deg, #1763ff, #e0506a); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header p { color: #64748b; margin-top: 4px; font-size: 13px; }

  /* DataRev lockup (top-left) */
  .dr-lockup { position: fixed; top: 12px; left: 16px; display: flex; align-items: center; gap: 10px; z-index: 100; }
  .dr-lockup img { height: 26px; width: auto; display: block; }
  .dr-lockup .dr-div { width: 1px; height: 24px; background: #334155; }
  .dr-lockup .dr-pe { font-size: 9px; line-height: 1.2; letter-spacing: 1.2px; color: #A3978F; text-transform: uppercase; font-weight: 700; text-align: left; }
  /* DataRev accent rule across the very top */
  body { border-top: 3px solid #1763ff; }
  @media (max-width: 560px) { .dr-lockup .dr-pe { display: none; } .header { padding-top: 52px; } }

  /* Pipeline nav */
  .pipeline { display: flex; justify-content: center; gap: 4px; padding: 16px 10px; flex-wrap: wrap; }
  .pip { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 8px 14px; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: all 0.4s; cursor: pointer; user-select: none; }
  .pip.active { border-color: #e0506a; background: #2a0e13; box-shadow: 0 0 16px rgba(23, 99, 255, 0.28); }
  .pip.done { border-color: #34d399; background: #064e3b; }
  .pip.locked { opacity: 0.4; cursor: default; }
  .pip-arrow { color: #334155; font-size: 14px; display: flex; align-items: center; }

  .container { max-width: 900px; margin: 0 auto; padding: 0 16px 60px; }

  /* Step card */
  .step-card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; overflow: visible; margin-top: 12px; animation: fadeUp 0.35s ease; }
  .step-header { padding: 20px 24px 16px; border-bottom: 1px solid #1e293b; }
  .step-num { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #e0506a; font-weight: 700; }
  .step-title { font-size: 22px; font-weight: 700; margin-top: 4px; }
  .step-desc { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-top: 8px; }
  .step-body { padding: 20px 24px; }

  /* Explanation callout */
  .callout { background: #0f172a; border-left: 3px solid #e0506a; border-radius: 0 8px 8px 0; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.6; color: #cbd5e1; }
  .callout strong { color: #f0a3ad; }
  .callout code { background: #1e293b; padding: 1px 6px; border-radius: 4px; font-size: 12px; color: #f472b6; }

  /* Analogy box */
  .analogy { background: linear-gradient(135deg, #2a0e13, #1e293b); border: 1px solid #8e1b2c; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; font-size: 13px; line-height: 1.6; }
  .analogy-label { color: #e07a8a; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; font-weight: 700; }

  /* Visual blocks */
  .vis-grid { display: grid; gap: 10px; margin: 12px 0; }
  .vis-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; font-size: 13px; transition: all 0.4s; }
  .vis-card.highlight { border-color: #e0506a; background: #2a0e13; }
  .vis-card.match { border-color: #34d399; background: #064e3b; }
  .vis-label { font-weight: 600; color: #e0506a; margin-bottom: 4px; font-size: 12px; }
  .vis-text { color: #94a3b8; line-height: 1.5; }
  .vis-tag { display: inline-block; background: #334155; border-radius: 4px; padding: 2px 8px; font-size: 11px; color: #94a3b8; margin: 2px; }
  .vis-tag.active { background: #8e1b2c; color: #f2b0ba; }

  /* Chunk pills */
  .chunk-pill { display: inline-block; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; margin: 3px; font-size: 11px; color: #94a3b8; transition: all 0.3s; }
  .chunk-pill.c0 { border-color: #e0506a; color: #f0a3ad; }
  .chunk-pill.c1 { border-color: #f472b6; color: #f9a8d4; }
  .chunk-pill.c2 { border-color: #34d399; color: #6ee7b7; }
  .chunk-pill.overlap { background: #4a1942; border-color: #f472b6; }

  /* Embedding viz */
  .emb-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .emb-word { width: 90px; text-align: right; font-size: 12px; color: #94a3b8; flex-shrink: 0; font-family: monospace; }
  .emb-bar-bg { flex: 1; height: 20px; background: #0f172a; border-radius: 4px; overflow: hidden; position: relative; }
  .emb-bar { height: 100%; border-radius: 4px; transition: width 0.8s ease; display: flex; align-items: center; padding-left: 6px; font-size: 10px; color: white; font-weight: 600; }
  .emb-val { width: 50px; text-align: right; font-size: 11px; color: #64748b; font-family: monospace; flex-shrink: 0; }

  /* Vector DB table */
  .vdb-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .vdb-table th { text-align: left; padding: 8px; color: #64748b; border-bottom: 1px solid #334155; font-weight: 600; }
  .vdb-table td { padding: 8px; border-bottom: 1px solid #1e293b; color: #94a3b8; }
  .vdb-table tr:hover { background: #2a0e1322; }
  .vdb-mini { display: flex; gap: 1px; align-items: flex-end; height: 16px; }
  .vdb-mini-bar { width: 3px; background: #e0506a; border-radius: 1px; transition: height 0.5s ease; }

  /* Similarity */
  .sim-card { background: #0f172a; border-radius: 10px; padding: 14px; margin-bottom: 10px; border-left: 4px solid transparent; transition: all 0.4s; }
  .sim-card.rank-1 { border-left-color: #fbbf24; }
  .sim-card.rank-2 { border-left-color: #94a3b8; }
  .sim-card.rank-3 { border-left-color: #78716c; }
  .sim-score { font-size: 28px; font-weight: 800; }
  .sim-bar { height: 6px; background: #1e293b; border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .sim-bar-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }

  /* LLM response */
  .llm-box { background: linear-gradient(135deg, #2a0e13, #1e293b); border: 1px solid #8e1b2c; border-radius: 12px; padding: 20px; }
  .llm-thinking { color: #e07a8a; font-size: 12px; margin-bottom: 12px; }
  .llm-answer { font-size: 15px; line-height: 1.7; }
  .llm-source { display: inline-block; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 4px 10px; font-size: 11px; margin: 4px 2px; color: #e0506a; }

  /* Controls */
  .controls { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 12px; flex-wrap: wrap; }
  .btn { border: none; border-radius: 10px; padding: 12px 28px; font-weight: 600; cursor: pointer; font-size: 14px; transition: all 0.2s; }
  .btn:hover { transform: translateY(-1px); }
  .btn:disabled { opacity: 0.4; cursor: default; transform: none; }
  .btn-primary { background: linear-gradient(135deg, #1763ff, #7a1020); color: white; }
  .btn-ghost { background: transparent; border: 1px solid #334155; color: #94a3b8; }
  .btn-ghost:hover { border-color: #e0506a; color: #f2b0ba; }
  .btn-reset { background: #1e293b; border: 1px solid #334155; color: #94a3b8; }
  .step-counter { color: #64748b; font-size: 13px; }

  /* Query input */
  .query-section { margin-top: 16px; }
  .query-box { display: flex; gap: 10px; }
  .query-input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px 16px; color: #e2e8f0; font-size: 14px; outline: none; }
  .query-input:focus { border-color: #e0506a; }
  .presets { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .preset { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 5px 12px; font-size: 11px; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
  .preset:hover { border-color: #e0506a; color: #f2b0ba; }

  /* Arrow animation */
  .arrow-flow { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 14px 0; color: #475569; font-size: 18px; flex-wrap: wrap; }
  .arrow-flow .arrow { animation: arrowPulse 1.5s ease infinite; }
  @keyframes arrowPulse { 0%,100% { opacity: 0.3; } 50% { opacity: 1; color: #e0506a; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .hidden { display: none; }

  /* Cosine formula */
  .formula { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; text-align: center; font-family: 'Georgia', serif; font-size: 16px; color: #f2b0ba; margin: 12px 0; letter-spacing: 0.5px; }

  /* Mode tabs (RAG / GraphRAG) */
  .mode-tabs { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .mode-tabs button { background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 10px; padding: 10px 24px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .mode-tabs button:hover:not(.active) { border-color: #e0506a; color: #f2b0ba; }
  .mode-tabs button.active { background: linear-gradient(135deg, #1763ff, #7a1020); color: #fff; border-color: transparent; }
  .mode-tabs button.active[data-mode="graphrag"] { background: linear-gradient(135deg, #0d9488, #0ea5e9); }
  .mode-tabs button.active[data-mode="advanced"] { background: linear-gradient(135deg, #ea580c, #f59e0b); }
  .mode-tabs button.active[data-mode="harness"] { background: linear-gradient(135deg, #7c3aed, #a970d0); }

  /* Glossary term tooltips */
  .term { border-bottom: 1px dotted #e0506a; cursor: help; position: relative; }
  .term > .tip {
    visibility: hidden; opacity: 0; transition: opacity 0.12s ease;
    position: absolute; left: 50%; bottom: calc(100% + 9px); transform: translateX(-50%);
    width: max-content; max-width: 260px;
    background: #0b1120; border: 1px solid #e0506a; color: #e2e8f0;
    font-size: 12px; font-weight: 400; line-height: 1.5; text-align: left; letter-spacing: normal;
    padding: 9px 11px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    z-index: 300; pointer-events: none; white-space: normal;
  }
  .term > .tip::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #e0506a; }
  .term:hover > .tip, .term:focus > .tip, .term.show > .tip { visibility: visible; opacity: 1; }
  .ar-mem-link:hover { fill: #e0506a; }

  /* Architecture-box popover */
  .arch-box { transition: filter 0.12s ease; }
  .arch-box:hover { filter: brightness(1.28); }
  .arch-tip { position: fixed; z-index: 400; display: none; max-width: 250px; background: #0b1120; border: 1px solid #f59e0b; color: #e2e8f0; font-size: 12px; line-height: 1.5; padding: 9px 11px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.55); pointer-events: none; }

  /* Memory summary modal */
  .mem-overlay { position: fixed; inset: 0; background: rgba(3,6,15,0.74); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); z-index: 500; display: flex; align-items: flex-start; justify-content: center; padding: 30px 16px; overflow-y: auto; animation: memFade 0.18s ease; }
  @keyframes memFade { from { opacity: 0; } to { opacity: 1; } }
  .mem-card { background: #12161f; border: 1px solid #334155; border-radius: 16px; max-width: 880px; width: 100%; padding: 26px 26px 22px; position: relative; box-shadow: 0 24px 70px rgba(0,0,0,0.6); animation: memRise 0.22s ease; }
  @keyframes memRise { from { transform: translateY(12px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  .mem-close { position: absolute; top: 14px; right: 14px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 14px; line-height: 1; }
  .mem-close:hover { border-color: #e0506a; color: #f0a3ad; }
  .mem-eyebrow { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #e0506a; font-weight: 700; }
  .mem-card h2 { font-size: 21px; margin: 6px 40px 6px 0; color: #e2e8f0; text-wrap: balance; }
  .mem-sub { color: #94a3b8; font-size: 13.5px; line-height: 1.55; margin-bottom: 18px; max-width: 68ch; }
  .mem-pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 680px) { .mem-pillars { grid-template-columns: 1fr; } }
  .mem-pillar { background: #0f172a; border: 1px solid #334155; border-top-width: 3px; border-radius: 10px; padding: 13px 14px; }
  .mem-pillar h3 { font-size: 14px; margin: 0; }
  .mem-pillar .pq { font-size: 11px; color: #64748b; margin: 3px 0 11px; line-height: 1.4; }
  .mem-item { margin-bottom: 9px; }
  .mem-item .k { font-size: 12.5px; font-weight: 700; color: #cbd5e1; }
  .mem-item .v { font-size: 11.5px; color: #94a3b8; line-height: 1.45; }
  .mem-tie { margin-top: 16px; background: #2a0e13; border-left: 3px solid #e0506a; border-radius: 0 8px 8px 0; padding: 12px 14px; font-size: 12.5px; line-height: 1.6; color: #cbd5e1; }
  .mem-frontiers { margin-top: 10px; font-size: 11.5px; color: #64748b; line-height: 1.5; }
  .mem-cite { margin-top: 12px; font-size: 11px; color: #64748b; border-top: 1px solid #1e293b; padding-top: 10px; }

  /* GraphRAG tab */
  .gr-ent { border-bottom: 1px solid; font-weight: 600; }
  .gr-triple { display: inline-block; background: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 4px 9px; margin: 3px; font-size: 11px; color: #cbd5e1; }
  .gr-rel { color: #f472b6; font-style: italic; margin: 0 3px; }
  .gr-svg-wrap { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 8px; margin: 12px 0; }
  .gr-com-card { background: #0f172a; border: 1px solid #334155; border-left-width: 4px; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; font-size: 13px; }
  .gr-badge { display: inline-block; border-radius: 20px; padding: 5px 14px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 12px; }
  .gr-badge.local { background: #2a0e13; color: #f0a3ad; border: 1px solid #8e1b2c; }
  .gr-badge.global { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
  .gr-path { background: #0f172a; border: 1px solid #8e1b2c; border-radius: 8px; padding: 12px 14px; text-align: center; font-family: monospace; font-size: 13px; color: #f2b0ba; margin: 12px 0; line-height: 1.9; }
  .cmp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin: 10px 0; }
  .cmp-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #334155; color: #e0506a; font-size: 12px; }
  .cmp-table td { padding: 8px 10px; border-bottom: 1px solid #1e293b; color: #94a3b8; vertical-align: top; line-height: 1.5; }
  .cmp-table td:first-child { color: #e2e8f0; font-weight: 600; }
</style>
</head>
<body>

<div class="lang-toggle" id="langToggle">
  <button data-lang="en">EN</button>
  <button data-lang="es">ES</button>
  <button data-lang="pt">PT</button>
</div>

<div class="dr-lockup" aria-label="DataRev">
  <img src="/brand/datarev-logo-white.png" alt="DataRev" />
</div>

<div class="header">
  <h1>RAG Simulator</h1>
  <p id="subtitle"></p>
</div>

<div class="mode-tabs" id="modeTabs">
  <button data-mode="rag" class="active" onclick="setMode('rag')">🔍 RAG</button>
  <button data-mode="graphrag" onclick="setMode('graphrag')">🕸️ GraphRAG</button>
  <button data-mode="advanced" onclick="setMode('advanced')">⚙️ Advanced RAG</button>
  <button data-mode="harness" onclick="setMode('harness')">🔧 Harness</button>
</div>

<div class="pipeline" id="pipeline"></div>

<div class="container" id="main"></div>

<script>
// ========== I18N ==========
const I18N = {
  es: {
    subtitle: 'Retrieval-Augmented Generation &mdash; Aprende paso a paso',
    stepLabels: ['Intro','Documentos','Limpieza','Chunking','Embedding','Vector DB','Query','Retrieve','Generate'],
    prev: '← Anterior',
    next: 'Siguiente →',
    end: 'Fin',
    search: 'Buscar 🔍',
    restart: '🔄 Reiniciar simulación',
    counter: (c,n) => `Paso ${c} de ${n}`,
    stepOf: (n) => `Paso ${n} de 8`,
    analogyLabel: '💡 Analogía',
    words: 'palabras',
    // Intro
    introNum: 'Introducción',
    introTitle: '¿Qué es RAG?',
    introDesc: 'RAG (Retrieval-Augmented Generation) es una técnica que mejora las respuestas de un LLM dándole contexto relevante extraído de tus propios documentos.',
    introAnalogy: 'Imagina que un LLM es un <strong>estudiante muy inteligente</strong> pero que solo sabe lo que estudió hasta cierta fecha. RAG es como darle un <strong>libro de apuntes</strong> justo antes del examen — no necesita memorizar todo, solo necesita <strong>buscar la página correcta</strong> y leer la respuesta.',
    introCallout: '<strong>El problema que resuelve:</strong> Los LLMs no conocen tus datos privados (manuales, docs, bases de datos). RAG les da acceso a esa información <em>en el momento de responder</em>, sin necesidad de re-entrenar el modelo.',
    introFlowTitle: 'El flujo completo que vamos a recorrer:',
    flowCards: ['📄 Documentos','🧹 Limpieza','✂️ Chunking','🧠 Embedding','💾 Vector DB','❓ Query','🔍 Retrieve','🤖 Generate'],
    // Docs
    docsTitle: '📄 Documentos originales',
    docsDesc: 'El primer paso es tener los documentos que contienen el conocimiento que queremos que el LLM pueda consultar.',
    docsAnalogy: 'Estos son los <strong>libros de la biblioteca</strong>. Antes de poder buscar en ellos, necesitamos organizarlos.',
    docsCallout: '<strong>En un sistema real</strong> estos podrían ser: PDFs, páginas web, documentación técnica, emails, bases de datos, etc. En esta simulación usamos 4 documentos de texto sobre tecnología.',
    // Parse & Clean
    parseTitle: '🧹 Parse & Clean (extracción y limpieza)',
    parseDesc: 'Antes de trocear, cada documento se convierte en <strong>texto limpio</strong>: se extrae el contenido (PDF, HTML, escaneos…) y se quita el ruido. El chunking asume que ya tienes texto limpio.',
    parseAnalogy: 'Es como <strong>pasar en limpio</strong> unos apuntes tomados a mano antes de estudiarlos: si la fotocopia salió borrosa o con manchas, primero la transcribes bien. Si no, estudiarías de basura.',
    parseCallout: '<strong>En un sistema real este paso hace:</strong> extraer texto (PDF→texto, OCR para escaneos), parsing <em>consciente del layout</em> (para no romper tablas ni columnas), quitar <em>boilerplate</em> (menús, encabezados, pies, números de página), normalizar (encoding, espacios) y extraer metadata (fuente, fecha).<br><br>«Garbage in, garbage out»: un PDF mal extraído arruina la recuperación por buenos que sean los embeddings.',
    parseBefore: 'Documento crudo (con ruido):',
    parseAfter: 'Texto limpio, listo para trocear:',
    parseArrow: 'parse &amp; clean',
    parseStructTitle: '¿Y los datos estructurados?',
    parseStruct: '<strong>No estructurados</strong> (PDF, web, emails) → <strong>siempre</strong> pasan por parse &amp; clean. <strong>Estructurados</strong> (SQL, tablas) → normalmente usan otro camino (<strong>text-to-SQL</strong> o serialización) en vez de chunking.',
    // Chunk
    chunkTitle: '✂️ Chunking (fragmentación)',
    chunkDesc: 'Los documentos son demasiado largos para compararlos directamente. Los dividimos en fragmentos pequeños (chunks) con algo de superposición.',
    chunkAnalogy: 'Es como cortar un libro en <strong>fichas de estudio</strong>. Cada ficha tiene un pedazo de información. Las fichas se superponen un poco para no perder contexto entre cortes.',
    chunkCallout: '<strong>¿Por qué chunks?</strong> Los modelos de embedding tienen un límite de tokens. Además, chunks pequeños permiten <strong>recuperar solo la parte relevante</strong>, no todo el documento.<br><br><strong>Parámetros:</strong> <code>chunk_size=30 palabras</code> y <code>overlap=10 palabras</code>',
    chunkOverlapTitle: 'Ejemplo visual de overlap:',
    chunkOv1: 'Chunk 1: palabras 1-30',
    chunkOv2: '← overlap: 10 palabras compartidas →',
    chunkOv3: 'Chunk 2: palabras 21-50',
    chunkPerDoc: (n) => `→ ${n} chunks`,
    chunkTotal: (c,d) => `Total: <strong style="color:#e2e8f0;">${c} chunks</strong> generados de ${d} documentos`,
    // Embed
    embedTitle: '🧠 Embedding (vectorización)',

// ========== RAG ENGINE ==========
class VectorDB {
  constructor() { this.vectors = []; }
  insert(id, embedding, metadata) { this.vectors.push({ id, embedding, metadata }); }
  cosineSimilarity(a, b) {
    let dot = 0, magA = 0, magB = 0;
    for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; magA += a[i]*a[i]; magB += b[i]*b[i]; }
    const d = Math.sqrt(magA) * Math.sqrt(magB);
    return d === 0 ? 0 : dot / d;
  }
  search(qe, topK = 3) {
    return this.vectors.map(v => ({ ...v, score: this.cosineSimilarity(qe, v.embedding) }))
      .sort((a,b) => b.score - a.score).slice(0, topK);
  }
}
class EmbeddingModel {
  constructor() { this.vocabulary = []; this.idf = {}; }
  buildVocabulary(docs) {
    const all = new Set(), dc = docs.length, wdf = {};
    for (const d of docs) { const uw = new Set(this.tok(d)); for (const w of uw) { all.add(w); wdf[w]=(wdf[w]||0)+1; } }
    this.vocabulary = [...all].sort();
    for (const w of this.vocabulary) this.idf[w] = Math.log(dc / (wdf[w]||1));
  }
  tok(t) { return t.toLowerCase().replace(/[^a-záéíóúñüãõçâêôàü0-9\s]/g,'').split(/\s+/).filter(w=>w.length>2); }
  embed(text) {
    const words = this.tok(text), tf = {};
    for (const w of words) tf[w]=(tf[w]||0)+1;
    for (const w of Object.keys(tf)) tf[w]/=words.length;
    const v = this.vocabulary.map(w => (tf[w]||0)*(this.idf[w]||0));
    const mag = Math.sqrt(v.reduce((s,x)=>s+x*x,0));
    return mag > 0 ? v.map(x=>x/mag) : v;
  }
  getTopDims(embedding, n=8) {
    return this.vocabulary.map((w,i) => ({word:w, val:embedding[i]}))
      .filter(x => x.val > 0).sort((a,b) => b.val - a.val).slice(0, n);
  }
}
function chunkText(text, sz=30, ov=10) {
  const w = text.split(/\s+/), ch = [];
  for (let i=0; i<w.length; i+=sz-ov) { const c=w.slice(i,i+sz).join(' '); if(c.trim()) ch.push(c); }
  return ch;
}

// ========== MODE TABS (RAG / GraphRAG) ==========
let appMode = 'rag';
function setMode(m) {
  if (m === appMode) return;
  appMode = m;
  document.querySelectorAll('#modeTabs button').forEach(b => b.classList.toggle('active', b.dataset.mode === appMode));
  renderApp();
}
function renderApp() {
  if (appMode === 'graphrag') { grRenderStep(); }
  else if (appMode === 'advanced') { arRenderStep(); }
  else if (appMode === 'harness') { hrRenderStep(); }
  else { renderChrome(); renderStep(); }
}

// Pre-compute
function initEngine() {
  documents = DOCS[lang];
  allChunks = [];
  for (const d of documents) {
    for (const c of chunkText(d.text)) allChunks.push({text:c, source:d.source});
  }
  emb.buildVocabulary(allChunks.map(c=>c.text));
  vdb.vectors = [];
  for (let i=0; i<allChunks.length; i++) {
    vdb.insert('chunk_'+i, emb.embed(allChunks[i].text), allChunks[i]);
  }
}

// ========== RENDER PIPELINE ==========
function renderPipeline() {
  const el = document.getElementById('pipeline');
  const labels = T().stepLabels;
  el.innerHTML = steps.map((s,i) => {
    const cls = i < currentStep ? 'done' : i === currentStep ? 'active' : 'locked';
    return (i > 0 ? '<span class="pip-arrow">→</span>' : '') +
      `<div class="pip ${cls}" onclick="${i<=currentStep?'goStep('+i+')':''}">${s.icon} ${labels[i]}</div>`;
  }).join('');
}

// ========== RENDER STEP CONTENT ==========
function renderStep() {
  renderPipeline();
  const m = document.getElementById('main');
  const renderers = [renderIntro, renderDocs, renderParse, renderChunk, renderEmbed, renderStore, renderQuery, renderRetrieve, renderGenerate];
  m.innerHTML = '';
  renderers[currentStep]();
  m.innerHTML += renderControls();
  attachControlEvents();
}

function renderControls() {
  const L = T();
  const isFirst = currentStep === 0;
  const isLast = currentStep === steps.length - 1;
  const isQuery = currentStep === 6;
  return `
    <div class="controls">
      <button class="btn btn-ghost" id="prevBtn" ${isFirst?'disabled':''}>${L.prev}</button>
      <span class="step-counter">${L.counter(currentStep+1, steps.length)}</span>
      ${isQuery
        ? `<button class="btn btn-primary" id="nextBtn" onclick="submitQuery()">${L.search}</button>`
        : `<button class="btn btn-primary" id="nextBtn" ${isLast?'disabled':''}>${isLast?L.end:L.next}</button>`
      }
    </div>
    ${currentStep === steps.length-1 ? `
      <div style="text-align:center; margin-top:16px;">
        <button class="btn btn-reset" onclick="restart()">${L.restart}</button>
      </div>
    `:''}
  `;
}

function attachControlEvents() {
  const prev = document.getElementById('prevBtn');
  const next = document.getElementById('nextBtn');
  if (prev) prev.onclick = () => { if(currentStep>0){ currentStep--; renderStep(); } };
  if (next && currentStep !== 6) next.onclick = () => { if(currentStep<steps.length-1){ currentStep++; renderStep(); } };
}

function goStep(i) { currentStep = i; renderStep(); }
function restart() { currentStep = 0; userQuery = ''; renderStep(); }

function generateAnswer(q, results) {
  const ql = q.toLowerCase();
  const topText = results[0]?.metadata.text || '';
  const topSource = results[0]?.metadata.source || '';

  if (lang === 'en') {
    if (ql.includes('javascript') && ql.includes('server')) {
      return `According to the <strong>${topSource}</strong> documentation, JavaScript runs on the server thanks to <strong>Node.js</strong>, a runtime built on Chrome's V8 engine. Node.js uses a non-blocking, event-driven input/output model, which makes it lightweight and efficient for server-side applications.`;
    }
    if (ql.includes('artificial intelligence') || ql.includes('data science') || ql.includes(' ai') || ql.includes('ai ')) {
      return `According to <strong>${topSource}</strong>, <strong>Python</strong> is the most widely used language for artificial intelligence and data science. It's a high-level, interpreted language with clear, readable syntax that supports multiple programming paradigms including object-oriented and functional programming.`;
    }
    if (ql.includes('database') || ql.includes('data stored') || ql.includes('sql')) {
      return `According to <strong>${topSource}</strong>, there are two main approaches: <strong>relational databases</strong> (like PostgreSQL and MySQL) that use tables and SQL as the query language, and <strong>NoSQL databases</strong> (like MongoDB) that store data in flexible JSON documents.`;
    }

    }
    return `Based on the retrieved documents, the most relevant information for your question comes from <strong>${topSource}</strong>: "${topText.slice(0, 150)}..."`;

  if (lang === 'pt') {

    }
    if (ql.includes('react') || ql.includes('dom')) {
      return `De acordo com <strong>${topSource}</strong>, React é uma biblioteca de JavaScript para construir interfaces de usuário, desenvolvida pelo Facebook. Otimiza as atualizações do navegador usando um <strong>DOM virtual</strong> — uma representação em memória do DOM real que permite calcular as mudanças mínimas necessárias antes de aplicá-las.`;
    }
    return `Com base nos documentos recuperados, a informação mais relevante sobre sua pergunta vem de <strong>${topSource}</strong>: "${topText.slice(0, 150)}..."`;
  }

  // Spanish
  if (ql.includes('javascript') && ql.includes('servidor')) {
    return `Según la documentación de <strong>${topSource}</strong>, JavaScript se ejecuta en el servidor gracias a <strong>Node.js</strong>, un entorno de ejecución construido con el motor V8 de Chrome. Node.js usa un modelo de operaciones de entrada/salida sin bloqueo y orientado a eventos, lo que lo hace liviano y eficiente para aplicaciones del lado del servidor.`;
  }
  if (ql.includes('inteligencia artificial') || ql.includes('ciencia de datos')) {
    return `De acuerdo con <strong>${topSource}</strong>, <strong>Python</strong> es el lenguaje más utilizado para inteligencia artificial y ciencia de datos. Es un lenguaje de alto nivel, interpretado, con sintaxis clara y legible que soporta múltiples paradigmas de programación incluyendo orientación a objetos y programación funcional.`;
  }
  if (ql.includes('base') && ql.includes('datos')) {
    return `Según <strong>${topSource}</strong>, existen dos enfoques principales: las <strong>bases de datos relacionales</strong> (como PostgreSQL y MySQL) que usan tablas y SQL como lenguaje de consulta, y las <strong>bases de datos NoSQL</strong> (como MongoDB) que almacenan datos en documentos JSON flexibles.`;
  }
  if (ql.includes('react') || ql.includes('dom')) {

      ['guardrails', 'Regras de segurança e controle: permissões (RBAC/ABAC), filtros e responder só a partir do contexto.'],
      ['RBAC/ABAC', 'RBAC = permissões por papel; ABAC = por atributos (usuário, recurso, contexto). Definem quem pode ver o quê.'],
      ['Ragas', 'Framework para avaliar sistemas RAG com métricas como fidelidade e relevância da resposta.'],
      ['fidelidade', 'Quão fiel é a resposta às fontes recuperadas (sem inventar).'],
      ['busca híbrida|recuperação híbrida', 'Combinar busca vetorial (Vector DB) e de grafo (Graph DB) na mesma consulta.'],
      ['metadata', 'Dados sobre o documento (fonte, data, autor…) que ajudam a filtrar e recuperar melhor.'],
      ['query', 'A pergunta ou consulta do usuário.']
    ])
  };
})();

// Walks text nodes under `root` and wraps the first occurrence of each glossary
// term in a tooltip span. Skips code/inputs/svg and already-wrapped terms.
function glossarize(root) {
  const G = GLOSSARY[lang];
  if (!G || !root) return;
  const keys = Object.keys(G).sort((a, b) => b.length - a.length);
  const alt = keys.map(k => k.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&')).join('|');
  let re;
  try { re = new RegExp('(?<![\\wÀ-ÿ])(' + alt + ')(?![\\wÀ-ÿ])', 'gi'); }
  catch (e) { return; }
  const seen = new Set();
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = node.parentElement;
      if (!p || p.closest('.term, code, script, style, svg, input, textarea, .query-input')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = [];
  let nd;
  while ((nd = walker.nextNode())) nodes.push(nd);
  for (const node of nodes) {
    const text = node.nodeValue;
    re.lastIndex = 0;
    let m, last = 0, frag = null;
    while ((m = re.exec(text))) {
      const key = m[1].toLowerCase();
      if (seen.has(key) || !G[key]) continue;
      seen.add(key);
      if (!frag) frag = document.createDocumentFragment();
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'term';
      span.tabIndex = 0;
      span.appendChild(document.createTextNode(m[1]));
      const tip = document.createElement('span');
      tip.className = 'tip';
      tip.textContent = G[key];
      span.appendChild(tip);
      frag.appendChild(span);
      last = m.index + m[1].length;
    }
    if (frag) {
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }
}

function setupGlossary() {
  const root = document.getElementById('main');
  if (!root) return;
  const obs = new MutationObserver(() => {
    obs.disconnect();
    try { glossarize(root); } catch (e) {}
    obs.observe(root, { childList: true, subtree: true });
  });
  glossarize(root);
  obs.observe(root, { childList: true, subtree: true });
  // Tap support (mobile): toggle the tooltip on click, close others.
  document.addEventListener('click', (e) => {
    const t = e.target.closest ? e.target.closest('.term') : null;
    document.querySelectorAll('.term.show').forEach(el => { if (el !== t) el.classList.remove('show'); });
    if (t) t.classList.toggle('show');
  });
}

initEngine();
renderChrome();
renderStep();
setupGlossary();
</script>
